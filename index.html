<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wie zit er naast jou</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Vaste HUD: jaartal dat meetelt + hoofdstuklabel -->
  <div class="hud">
    <div class="hud-year" id="year">1996</div>
    <div class="hud-label" id="label">1996 – 2026</div>
  </div>

  <main class="pin" id="pin">
    <div class="track" id="track"></div>
  </main>

  <div class="scroll-hint" id="hint">Scroll om te beginnen</div>

  <!-- Kleine schermen (telefoon): de strip is gemaakt voor 1440 × 900 -->
  <div class="klein-scherm" role="dialog" aria-modal="true" aria-labelledby="klein-titel">
    <p class="klein-titel" id="klein-titel">Wie zit er naast jou?</p>
    <p class="klein-tekst">Deze strip is gemaakt voor een groter scherm. Open hem op een laptop of computer.</p>
    <button class="klein-knop" id="toch" type="button">Toch bekijken</button>
  </div>

  <!-- Einde: terug naar het begin -->
  <button class="opnieuw" id="opnieuw" type="button">Opnieuw beginnen</button>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="js/shapes.js"></script>
  <script src="js/assets.js"></script>
  <script src="js/scenes.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
